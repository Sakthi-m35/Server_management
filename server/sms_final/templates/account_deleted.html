<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Removed — SMS</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="status-page">
<div class="status-card">
  <div class="status-icon deleted">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
    </svg>
  </div>
  <h2>Account Removed</h2>
  <p>Your account has been permanently removed from the platform. All associated data has been deleted. Please contact your administrator for more information.</p>
  <div class="status-detail">
    <div class="label">Removed By</div>
    <div class="value" id="deleted-by">—</div>
  </div>
  <div class="status-detail">
    <div class="label">Removed On</div>
    <div class="value" id="deleted-at">—</div>
  </div>
  <a href="/" class="back-btn">Return to Sign In</a>
</div>
<script>
  try {
    const info = JSON.parse(sessionStorage.getItem("deleted_info") || "{}");
    document.getElementById("deleted-by").textContent = info.deleted_by || "System Administrator";
    if (info.deleted_at) {
      const d = new Date(info.deleted_at);
      document.getElementById("deleted-at").textContent = isNaN(d) ? info.deleted_at :
        d.toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
    }
    sessionStorage.removeItem("deleted_info");
  } catch {}
</script>
</body></html>
