<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecting — SMS</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth">
<div class="box">
  <div class="brand">SMS Platform</div>
  <h2>Loading</h2>
  <p class="sub">Redirecting to your dashboard...</p>
  <div style="margin-top:20px"><span class="spin"></span></div>
</div>
<script>
  const usr = (() => { try { return JSON.parse(localStorage.getItem("sms_user")||"null"); } catch { return null; } })();
  const map = { super_admin:"/super-admin", admin:"/admin", user:"/user" };
  if (usr && map[usr.role]) window.location.href = map[usr.role];
  else window.location.href = "/";
</script>
</body></html>
