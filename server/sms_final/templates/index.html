<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — SMS</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth" data-page="login">
<div class="box">
  <div class="brand">SMS Platform</div>
  <h2>Sign In</h2>
  <p class="sub">Server Management System</p>
  <input type="email"    id="email"    placeholder="Email address" autocomplete="username">
  <input type="password" id="password" placeholder="Password"      autocomplete="current-password">
  <button id="login-btn">Sign In</button>
  <div id="msg"></div>
  <p>No account? <a href="/signup">Create one</a></p>
</div>
<script type="module" src="/static/js/auth.js"></script>
</body></html>
