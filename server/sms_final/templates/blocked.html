<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Blocked — SMS</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="status-page">
<div class="status-card">
  <div class="status-icon blocked">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
    </svg>
  </div>
  <h2>Account Suspended</h2>
  <p>Your account has been suspended and you are unable to access the platform. Please contact your administrator if you believe this is an error.</p>
  <div class="status-detail">
    <div class="label">Suspended By</div>
    <div class="value" id="blocked-by">—</div>
  </div>
  <div class="status-detail">
    <div class="label">Account</div>
    <div class="value" id="blocked-email">—</div>
  </div>
  <a href="/" class="back-btn">Return to Sign In</a>
</div>
<script>
  try {
    const info = JSON.parse(sessionStorage.getItem("blocked_info") || "{}");
    document.getElementById("blocked-by").textContent    = info.blocked_by || "System Administrator";
    document.getElementById("blocked-email").textContent = info.email      || "—";
    sessionStorage.removeItem("blocked_info");
  } catch {}
</script>
</body></html>
